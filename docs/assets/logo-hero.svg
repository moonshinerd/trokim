<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trokim">
  <style>
    .cap{animation:cap 1s cubic-bezier(.2,0,0,1) both}
    .left{animation:left 1s .08s cubic-bezier(.2,0,0,1) both}
    .gold{animation:gold 1s .16s cubic-bezier(.2,0,0,1) both}
    @keyframes cap{from{transform:translateY(-18px);opacity:0}}
    @keyframes left{from{transform:translate(-16px,10px);opacity:0}}
    @keyframes gold{from{opacity:0;transform:translate(17.4px,16.2px)}}
    @media (prefers-reduced-motion:reduce){.cap,.left,.gold{animation:none}}
  </style>
  <defs><clipPath id="c"><circle cx="32" cy="32" r="29"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect class="cap" x="-2" y="-6" width="68" height="30.2" rx="3" fill="#FFFFFF"/>
    <rect class="left" x="-2" y="27.8" width="32.2" height="40" rx="3" fill="#4FD1A5"/>
  </g>
  <g class="gold" transform="translate(1.4 2.2)"><g clip-path="url(#c)" transform="translate(-1.4 -2.2)">
    <rect x="33.8" y="27.8" width="32.2" height="40" rx="3" fill="#E9B44C" transform="translate(1.4 2.2)"/>
  </g></g>
</svg>
