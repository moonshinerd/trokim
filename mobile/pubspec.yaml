name: trokim
description: "Trokim — Assistente financeiro pessoal open-source com foco em privacidade local-first e RAG (Challenge 2)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  file_picker: ^13.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  url_launcher: 6.3.2

dependency_overrides:
  # Mantém compatibilidade com a versão mínima do Flutter usada pelo projeto.
  url_launcher_android: 6.3.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
