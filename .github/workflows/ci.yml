name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint + testes)
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest

  research:
    name: research (benchmark rag + lint)
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}
      - name: Instalar dependências fixadas
        run: cd api && uv sync --frozen
      - name: Verificar lint e formatação de research
        run: |
          cd api
          uv run ruff check --config pyproject.toml ../research
          uv run ruff format --check --config pyproject.toml ../research
      - name: Validar curadoria, dados e benchmark
        run: make research-test
      - name: Preservar relatório por caso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-benchmark
          path: artifacts/research/current.json
          if-no-files-found: warn

  docs:
    name: docs (zensical build strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx zensical build --strict
