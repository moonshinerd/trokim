[project]
name = "trokim-api"
version = "0.1.0"
description = "Trokim API — Backend local-first para assistente financeiro pessoal com RAG e parsing de extratos (OFX/PDF)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20",
    "ofxparse>=0.21",
    "pypdf>=5.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "litellm>=1.40",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
