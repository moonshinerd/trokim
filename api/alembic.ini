# Migrações dos bancos SQLite do Trokim (ADR 0019). A API aplica tudo sozinha ao abrir cada
# banco; este arquivo serve para criar revisões novas, sempre com o próximo número:
#
#   uv run alembic -n app revision --autogenerate -m "descricao" --rev-id 002
#   uv run alembic -n vetorial revision -m "descricao" --rev-id 002

[app]
script_location = %(here)s/migrations/app
sqlalchemy.url = sqlite:///trokim.db
file_template = %%(rev)s_%%(slug)s

[vetorial]
script_location = %(here)s/migrations/vetorial
sqlalchemy.url = sqlite:///data/vector_store.db
file_template = %%(rev)s_%%(slug)s
